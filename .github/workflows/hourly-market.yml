name: Hourly market refresh

# Redraws the index chart at the top of the page without touching the fund
# data. Four weekday fires, not sixteen: 08:17 after the LSE open, 13:17 just
# before the US open, 17:17 through the US afternoon, and 21:17 after the US
# close. Overnight and weekend hours are skipped, where a run would re-fetch
# numbers that have not moved.
#
# It asked for every hour from 07:17 to 22:17 until 31 Aug 2026. That did not
# survive contact with GitHub's scheduler, which is best-effort and sheds
# scheduled runs under load: over the six days to 31 Aug, roughly 80 requested
# fires produced 11 actual runs - several of them hours outside the requested
# window, and a two-day gap with none at all. Asking for less gets more. A
# handful of fires a day stands a far better chance of each being honoured
# than a queue of sixteen that mostly evaporates, and the chart is fresher for
# it despite the smaller number on the cron line.
#
# The :17 is deliberate. The top of the hour is the scheduler's busiest slot,
# so an off-peak minute drifts less.
#
# This schedule is still best-effort and is not a clock. Nothing here is
# load-bearing - a dropped run means the chart is a few hours stale, not
# wrong. When a particular refresh matters, dispatch it by hand.

on:
  schedule:
    - cron: "17 8,13,17,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with the daily fund update: both workflows publish to Pages, and two
# deployments in flight at once will collide. Queue instead of cancelling -
# a dropped run here just means the chart is an hour staler.
concurrency:
  group: fund-tracker-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Standard library only - nothing to install, no secrets.
      #
      # Deliberately not committed here, though data/market.json is tracked and
      # the daily run does commit it. This workflow fires several times a day
      # and the file is rewritten in full each time, so committing it here
      # would add a few hundred KB of churn a day and bury the daily updates
      # in the log. The copy on main is therefore up to a day behind the one
      # being served, which is the intended trade: the published chart is
      # always fresh, and the committed copy exists so a clone can render the
      # page at all.
      - name: Fetch index series
        run: python scripts/market_series.py

      # funds.json is whatever the daily run last committed; only the chart
      # data is regenerated here.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp data/funds.json  _site/funds.json
          cp data/last_run.md _site/last_run.md
          cp data/market.json _site/market.json

      # v4 of this action stopped including dotfiles in the artifact, and does
      # so silently. Nothing here is hidden - the four files above are copied
      # in by name - but a future `.nojekyll` or similar dropped into _site
      # would vanish from the deploy without a word. `include-hidden-files:
      # true` is the escape hatch if that ever changes.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
