name: Daily fund update

on:
  schedule:
    # 06:23 UTC every day. The odd time is deliberate, for two reasons. The
    # top of the hour is the scheduler's busiest slot, so an off-peak minute
    # drifts less - the same reasoning as the hourly refresh's :17. And 06:23
    # lands before the hourly window opens at 07:17, so these two workflows
    # never queue behind one another on the shared Pages concurrency group.
    # Still best-effort: GitHub can drift this by an hour, or skip it
    # entirely under load. It is not a precise clock.
    - cron: "23 6 * * *"
  workflow_dispatch:            # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      # Redeploy as soon as the page changes, so an edit to the site does not
      # sit undeployed until the next 06:23 run. Pushes made by this workflow's
      # own bot use GITHUB_TOKEN, which does not re-trigger workflows - no loop.
      #
      # This file is deliberately NOT in the list. It was, and every edit to it
      # therefore fired a full run: refetch every NAV, regenerate all three data
      # files and commit them - for a change that touched no data and altered
      # nothing about what gets published. An evening of workflow edits left six
      # "Daily update" commits on main. Editing the pipeline is not a reason to
      # rerun it; dispatch it by hand when a change here needs proving.
      - "site/**"

# Public repos get unlimited GitHub Actions minutes, so a daily run costs
# nothing. Scheduled workflows are auto-disabled after 60 days of repo
# inactivity - this job commits on most runs, which resets that timer.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Shared with the hourly market refresh: both publish to Pages and two
  # deployments in flight at once will collide.
  group: fund-tracker-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No dependencies to install and no secrets to configure - the scripts
      # use only the Python standard library and free public endpoints.

      # Prices each fund from its own published NAV where a symbol resolves.
      # Runs before run_update.py so the audit summary counts the fresh ones.
      - name: Refresh fund NAVs
        run: python scripts/fund_nav.py

      - name: Run the update
        run: python scripts/run_update.py
        working-directory: ${{ github.workspace }}

      - name: Anonymisation check
        run: python scripts/anonymise.py data/funds.json data/funds.json

      # Moved ahead of the commit so the chart data is committed with the rest
      # of the run rather than only written into the Pages artifact.
      #
      # continue-on-error because of what sits after it: the commit step. The
      # chart aborts the whole script when no index fetches - correct on its
      # own terms, it exists to stop an empty chart reaching the page - but
      # without this line that abort also skips the commit, and a full NAV
      # refresh across ~70 funds is computed and then thrown away because
      # Yahoo throttled a runner for a minute. The two datasets are
      # independent and the cheap one must not be able to discard the
      # expensive one. On failure market.json keeps its previous contents, so
      # the deploy carries a stale chart rather than none, and the fund data
      # commits normally. Watch the step annotation, not the job colour: a
      # tolerated failure here still needs reading, and the run log now names
      # the HTTP status so a throttle is distinguishable from a moved endpoint.
      - name: Fetch index series
        continue-on-error: true
        run: python scripts/market_series.py

      - name: Commit updated data
        run: |
          git config user.name  "fund-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          # main can have moved since checkout - a hand-pushed change, or a run
          # that overlapped this one. Rebasing onto it is the wrong tool here:
          # an overlapping run has regenerated the same JSON, so every hunk
          # conflicts and there is no merge to make. The newer run's output is
          # simply the answer. So move onto whatever main is now, keeping this
          # run's files in the working tree, and commit them on top.
          #
          # --mixed, not --soft: --soft would leave the index holding the tree
          # from before the fetch, quietly reverting anything the incoming
          # commits changed. This way the commit contains these three files and
          # nothing else.
          git fetch origin main
          git reset --mixed FETCH_HEAD
          git add data/funds.json data/last_run.md data/market.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily update: $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          # Stamp the deployed copy with the commit it was built from. The page
          # compares this against the served file to tell whether the copy the
          # browser is holding has been superseded - see newBuildAvailable().
          # Only _site is stamped; the repo keeps its placeholder, which is how
          # the page knows it is being opened locally rather than served.
          sed -i "s/__BUILD__/$GITHUB_SHA/" _site/index.html
          cp data/funds.json  _site/funds.json
          cp data/last_run.md _site/last_run.md
          cp data/market.json _site/market.json

      # v4 of this action stopped including dotfiles in the artifact, and does
      # so silently. Nothing here is hidden - the four files above are copied
      # in by name - but a future `.nojekyll` or similar dropped into _site
      # would vanish from the deploy without a word. `include-hidden-files:
      # true` is the escape hatch if that ever changes.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
