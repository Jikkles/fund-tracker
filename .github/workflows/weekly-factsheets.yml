name: Weekly factsheet refresh

# Re-scrapes each fund's HL factsheet for the depth a NAV series cannot
# supply: top ten holdings, sector and country splits, fund size, launch
# date, historic yield, the net ongoing charge, manager tenure and the
# discrete annual periods. Then reads Fidelity's factsheet for the sector
# comparators, SRRI and transaction costs HL does not carry.
# Also re-reads NS&I's Premium Bonds prize allocation, rate and odds for the
# calculator tab.
#
# WEEKLY, NOT DAILY, for two reasons. None of this data moves daily - a
# holdings table is republished monthly at best - so a daily scrape would
# re-fetch 70 pages to learn nothing. And they are someone else's pages: the
# script already pauses between requests, and asking once a week rather than
# seven times is the same courtesy at the other end.
#
# Sunday 05:41 UTC: a quiet slot, off the top of the hour like the other two
# schedules, and finished well before the daily run's 06:23 so the shared
# Pages concurrency group is free by then.
#
# This workflow exists because the scraper did not have one. It was written,
# tested and then only ever run by hand, so the research it refreshes was
# ageing towards the 120-day stale warning that the scraper was built to
# prevent - the tool was there, the schedule was not.

on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with the daily update and the hourly chart refresh: all three
# publish to Pages, and two deployments in flight at once will collide.
concurrency:
  group: fund-tracker-pages
  cancel-in-progress: false

jobs:
  factsheets:
    runs-on: ubuntu-latest
    # Healthy runs take 12-18 minutes (~400 pages at a polite rate). Without
    # a cap a stall runs to GitHub's six-hour limit while holding the
    # fund-tracker-pages group, and the daily and hourly runs queue behind it
    # the whole time - the daily run already learnt this on 2026-09-25.
    # Forty-five minutes is well over double the slowest run seen.
    timeout-minutes: 45
    env:
      # Unbuffered, so a stalled or killed step's log shows how far it got.
      PYTHONUNBUFFERED: "1"
    steps:
      # ref: main, because the default is the commit this run was CREATED on,
      # and a run queued on the fund-tracker-pages group can start long after
      # main has moved. See the same step in daily-update.yml for what that
      # cost on 2026-11-01.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Standard library only - nothing to install, no secrets.
      #
      # A fund whose page cannot be reached, or whose page turns out to
      # describe a different share class, is reported and skipped rather
      # than partially applied - so a bad day at HL leaves the stored
      # research exactly as it was instead of overwriting it with a
      # confident wrong figure. That means this step succeeding is not the
      # same as every fund refreshing; read the log for the per-fund lines.
      #
      # The four refresh steps below are independent and each one TOLERATES
      # FAILURE. They used to be a chain: a crash in one (fid_factsheet.py
      # died on a truncated page on 2026-10-18 and 2026-11-01) skipped every
      # step after it - the other scrapers, the commit and the deploy - and
      # threw away whatever had already been refreshed. Each script writes its
      # file atomically and only at the end, so a step that dies leaves its
      # file exactly as it was; the anonymisation check then re-proves
      # funds.json parses before anything is committed. The last step of the
      # job turns any tolerated failure into a visible warning.
      - name: Refresh factsheet depth
        id: hl
        continue-on-error: true
        run: python scripts/hl_factsheet.py

      # The comparators HL does not publish - sector/category averages beside
      # the 1/3/5yr and discrete figures, the KIID SRRI, transaction costs -
      # read from Fidelity's factsheet. Runs AFTER the HL step because it
      # proves each Fidelity page is the right share class against the SEDOL
      # the HL step has just confirmed. Same contract as above: a fund that
      # fails any gate is reported as SKIP and left exactly as it was.
      - name: Refresh comparators from Fidelity
        id: fid
        continue-on-error: true
        run: python scripts/fid_factsheet.py

      # The Premium Bonds tab's figures - prize fund rate, odds and the count
      # of every prize - from NS&I's own pages. Independent of the funds and
      # two requests, so it rides along here rather than having a schedule of
      # its own. Same contract as the steps above: a page that fails any gate
      # (totals that do not add up, the two pages disagreeing on the rate) is
      # reported as SKIP and data/premium_bonds.json is left as it was; the tab
      # shows the date of the last good check, so a run of refusals is visible.
      - name: Refresh Premium Bonds prize data
        id: bonds
        continue-on-error: true
        run: python scripts/premium_bonds.py

      # The publish gate, same as the daily run: this fails the build rather
      # than shipping a personal reference or internal-process vocabulary.
      - name: Anonymisation check
        run: python scripts/anonymise.py data/funds.json data/funds.json

      - name: Commit refreshed research
        run: |
          # A one-line marker the "Fund tracker weekly factsheets top-up"
          # cloud routine reads to tell whether this week's run landed -
          # funds.json is too large for it to fetch. Same role as the first
          # line of last_run.md for the daily top-up.
          #
          # Written only when BOTH fund scrapers succeeded. With the steps now
          # tolerating failure, an unconditional marker would tell Monday's
          # routine the week was done when HL or Fidelity had failed outright -
          # and the one automatic second chance would be skipped.
          files="data/funds.json data/premium_bonds.json"
          if [ "${{ steps.hl.outcome }}" = success ] && [ "${{ steps.fid.outcome }}" = success ]; then
            echo "# Weekly factsheet refresh $(date -u +%F)" > data/last_factsheets.md
            files="$files data/last_factsheets.md"
          else
            echo "::warning::A factsheet scraper failed - last_factsheets.md left as it was so the Monday top-up routine re-runs this workflow."
          fi
          # Same commit logic as the daily run - see scripts/commit_data.sh.
          bash scripts/commit_data.sh "Weekly factsheet refresh: $(date -u +%Y-%m-%d)" $files

      # funds.json has just changed, so the page is rebuilt and redeployed
      # rather than left waiting for the next daily run - a data-only commit
      # does not match the daily workflow's site/** push trigger.
      #
      # continue-on-error for the same reason as in the daily run: the chart
      # is the cheap dataset, and a Yahoo throttle must not cost the deploy of
      # a research refresh that has already been committed. On failure
      # market.json keeps its committed contents and the deploy carries a
      # slightly older chart.
      - name: Fetch index series
        id: chart
        continue-on-error: true
        run: python scripts/market_series.py

      # Stamp, copy every file the page fetches, and run the anonymisation
      # gate - one script shared by all three deploying workflows, so they
      # cannot drift apart again. See scripts/assemble_site.sh.
      - name: Assemble site
        run: bash scripts/assemble_site.sh

      # v4 of this action stopped including dotfiles in the artifact, and does
      # so silently. Nothing here is hidden - the five files above are copied
      # in by name - but a future `.nojekyll` or similar dropped into _site
      # would vanish from the deploy without a word. `include-hidden-files:
      # true` is the escape hatch if that ever changes.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # A tolerated failure turns the step amber in the log but leaves the
      # job green, which is easy to miss. Name each one as a warning on the
      # run's summary page instead.
      - name: Report tolerated failures
        if: always()
        run: |
          for pair in "Refresh factsheet depth=${{ steps.hl.outcome }}" \
                      "Refresh comparators from Fidelity=${{ steps.fid.outcome }}" \
                      "Refresh Premium Bonds prize data=${{ steps.bonds.outcome }}" \
                      "Fetch index series=${{ steps.chart.outcome }}"; do
            name="${pair%%=*}"; outcome="${pair##*=}"
            if [ "$outcome" = failure ]; then
              echo "::warning::'$name' failed and was tolerated - its data was left as it was. Read that step's log."
            fi
          done

  deploy:
    needs: factsheets
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
